name: lighthouse

on:
  workflow_dispatch:
    inputs:
      url:
        description: Target URL
        default: https://johndavidportfolio.netlify.app
      device:
        description: mobile or desktop
        default: mobile
  schedule:
      - cron: "15 12 * * *"     # 17:30 IST daily

jobs:
  perf:
    runs-on: ubuntu-latest
    env:
      PERF_URL: ${{ inputs.url || 'https://johndavidportfolio.netlify.app' }}
      PERF_DEVICE: ${{ inputs.device || 'mobile' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - name: Restore history
        uses: actions/cache/restore@v4
        with:
          path: perf-results
          key: perf-history-${{ github.run_id }}
          restore-keys: perf-history-

      - name: Run Lighthouse
        run: node src/perf.mjs --runs 3 --thresholds thresholds.example.json --fail-on fail

      - name: Save history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: perf-results
          key: perf-history-${{ github.run_id }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: perf-results

      - name: Read verdict
        if: always() && hashFiles('perf-results/reports/latest-summary.md') != ''
        run: |
          echo "VERDICT=$(head -1 perf-results/reports/latest-summary.md | sed 's/## Lighthouse: //')" >> "$GITHUB_ENV"
          
      - name: Email report
        if: always() && hashFiles('perf-results/reports/latest.html') != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: Lighthouse Monitor <${{ secrets.MAIL_USERNAME }}>
          subject: "Lighthouse ${{ env.VERDICT }} - ${{ env.PERF_URL }} - ${{ github.run_number }}"
          body: file://perf-results/reports/latest-summary.md
          attachments: perf-results/reports/latest.html
